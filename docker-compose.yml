version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: taskflow-redis
    ports:
      - "6379:6379"
    networks:
      - taskflow_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb+srv://task:task12345@cluster0ok.cxldvi9.mongodb.net/?appName=Cluster0ok
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: taskflow_super_secret_jwt_key
      NODE_ENV: development
    depends_on:
      - redis
    networks:
      - taskflow_network

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: taskflow-worker
    environment:
      MONGO_URI: mongodb+srv://task:task12345@cluster0ok.cxldvi9.mongodb.net/?appName=Cluster0ok
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: development
    depends_on:
      - redis
    networks:
      - taskflow_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskflow-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    depends_on:
      - backend
    networks:
      - taskflow_network

volumes: {}

networks:
  taskflow_network:
    driver: bridge