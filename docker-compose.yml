version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: taskflow-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - taskflow_network

  redis:
    image: redis:alpine
    container_name: taskflow-redis
    ports:
      - "6379:6379"
    networks:
      - taskflow_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/taskflow
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=taskflow_super_secret_jwt_key
    depends_on:
      - mongodb
      - redis
    networks:
      - taskflow_network

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: taskflow-worker
    environment:
      - MONGO_URI=mongodb://mongodb:27017/taskflow
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mongodb
      - redis
    networks:
      - taskflow_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskflow-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - taskflow_network

volumes:
  mongodb_data:

networks:
  taskflow_network:
    driver: bridge
